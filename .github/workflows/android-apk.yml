name: Android APK

on:
  push:
    branches:
      - main
      - fix/offline-persistent-profile
      - feature/android-offline-wrapper
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js for JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
          echo "JavaScript syntax validation passed."

      - name: Rebuild production game bundle
        run: node tools/build.js --sin-seo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare and validate release signing key
        id: release_signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        continue-on-error: true
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Remove accidental line breaks/spaces from secrets copied from text files.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/pokesurvivor-release.jks"
          STORE_PASSWORD="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')"
          test -s "$RUNNER_TEMP/pokesurvivor-release.jks"
          # Fail here with a clear message instead of later during APK packaging.
          keytool -list -keystore "$RUNNER_TEMP/pokesurvivor-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          # Exercise the private key with a temporary CSR; do not mutate the keystore just to validate it.
          keytool -certreq -keystore "$RUNNER_TEMP/pokesurvivor-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/pokesurvivor-signing-check.csr"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pokesurvivor-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing keystore, alias, and passwords validated."

      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true' && steps.release_signing.outcome == 'success'
        id: release_build
        working-directory: android-wrapper
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK fallback
        if: always() && (env.HAS_RELEASE_SIGNING != 'true' || steps.release_signing.outcome != 'success' || failure())
        working-directory: android-wrapper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-android-apks-${{ github.run_number }}
          path: android-wrapper/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
