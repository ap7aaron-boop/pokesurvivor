name: Android APK

on:
  push:
    branches:
      - main
      - fix/offline-persistent-profile
      - feature/android-offline-wrapper
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare release signing key
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pokesurvivor-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pokesurvivor-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: android-wrapper
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK
        if: env.HAS_RELEASE_SIGNING != 'true'
        working-directory: android-wrapper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_RELEASE_SIGNING == 'true' && 'pokesurvivor-offline-release' || 'pokesurvivor-offline-debug' }}
          path: android-wrapper/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
